name: Run Telegram Userbot

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# STRICT SINGLETON: Never allow more than 1 instance to run simultaneously!
concurrency:
  group: telegram-userbot-singleton
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-userbot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Userbot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TARGET_GROUP: ${{ secrets.TARGET_GROUP }}
        run: |
          timeout 20700 python main.py || echo "Cycle completed."

      - name: Keep Running 24/7 (Trigger Next Run)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run run_bot.yml --ref main || echo "Scheduled cron will pick up next run."
